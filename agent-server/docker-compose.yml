services:
  # ── Service 1: FastAPI Health & Monitoring API ──────────────
  api:
    image: ${DOCKER_IMAGE:-resumarq-agent-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumarq-agent-api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Service 2: Background Redis Worker ───────────────────────
  worker:
    image: ${DOCKER_IMAGE:-resumarq-agent-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumarq-agent-worker
    restart: always
    command: python worker.py
    env_file:
      - .env
    environment:
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-2}
